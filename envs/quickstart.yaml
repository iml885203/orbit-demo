# Generated by scripts/sync-quickstart.sh — do not edit.
# The same environment as ../orbit.yaml, packaged for `orbit init`:
# the sync that backs environment sources ships envs/seeds/**, so the
# app runs from envs/seeds/mini-shop (a byte-for-byte copy of apps/).
version: "3"

settings:
  shutdown_timeout: 10s
  health_check_interval: 1s

containers:
  redis:
    image: redis:7.4-alpine
    ports:
      redis:
        preferred: 26379
        target: 6379
    health_check:
      type: tcp

services:
  shop-catalog-api:
    type: python
    kind: backend
    path: seeds/mini-shop
    command: python3 catalog.py
    ports:
      http:
        preferred: 28101
    health_check:
      type: http
      path: /health

  shop-inventory-api:
    type: python
    kind: backend
    path: seeds/mini-shop
    command: python3 inventory.py
    ports:
      http:
        preferred: 28102
    depends_on: [redis]
    health_check:
      type: http
      path: /health

  shop-order-api:
    type: python
    kind: backend
    path: seeds/mini-shop
    command: python3 orders.py
    ports:
      http:
        preferred: 28103
    depends_on: [shop-catalog-api, shop-inventory-api]
    health_check:
      type: http
      path: /health

  demo-shop:
    type: python
    kind: frontend
    path: seeds/mini-shop
    command: python3 web.py
    ports:
      http:
        preferred: 28080
    depends_on: [shop-catalog-api, shop-inventory-api, shop-order-api]
    health_check:
      type: http
      path: /health

groups:
  mini-shop:
    enabled: true
    services: [shop-catalog-api, shop-inventory-api, shop-order-api, demo-shop]
