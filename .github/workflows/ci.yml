name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - name: Validate sources
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          for source in Path("apps").glob("*.py"):
              compile(source.read_text(), str(source), "exec")
          smoke = Path("scripts/smoke.py")
          compile(smoke.read_text(), str(smoke), "exec")

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if values.get("id"):
                      self.ids.add(values["id"])

          page = Page()
          page.feed(Path("apps/index.html").read_text())
          required = {
              "run-success",
              "run-failure",
              "status",
              "result",
              "attempt",
              "stock-change",
              "reservation-change",
              "order-change",
              "adopt-project",
          }
          assert required <= page.ids, required - page.ids
          PY
          node - <<'JS'
          const fs = require("fs");
          const html = fs.readFileSync("apps/index.html", "utf8");
          const source = html.match(/<script>([\s\S]*?)<\/script>/)[1]
            .replaceAll("{{CATALOG_URL}}", "http://127.0.0.1:1")
            .replaceAll("{{INVENTORY_URL}}", "http://127.0.0.1:2")
            .replaceAll("{{ORDER_URL}}", "http://127.0.0.1:3");
          new Function(source);
          JS
          node --test tests/*.test.mjs
      - name: Exercise the manual runtime journey without Orbit
        env:
          DATA_DIR: ${{ runner.temp }}/manual-data
        run: |
          cleanup() {
            kill "$runner_pid" >/dev/null 2>&1 || true
            docker rm -f mini-shop-redis >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ./scripts/run-local.sh &
          runner_pid=$!
          timeout 120 bash -c '
            for port in 28101 28102 28103 28080; do
              until curl -fsS "http://127.0.0.1:$port/health" >/dev/null 2>&1; do
                sleep 1
              done
            done
          '
          python3 scripts/smoke.py
      - name: Install the paired Orbit preview
        run: |
          ORBIT_VERSION="$(jq -r '.version' .orbit-release.json)"
          ORBIT_COMMIT="$(jq -r '.orbit_commit' .orbit-release.json)"
          if ! curl --fail --silent --show-error --location \
            --output /usr/local/bin/orbit \
            "https://github.com/iml885203/orbit/releases/download/${ORBIT_VERSION}/orbit-linux-amd64"; then
            git clone --filter=blob:none https://github.com/iml885203/orbit.git orbit-source
            git -C orbit-source checkout "$ORBIT_COMMIT"
            pnpm --dir orbit-source/ui install --frozen-lockfile
            make -C orbit-source VERSION="$ORBIT_VERSION" build
            cp orbit-source/bin/orbit /usr/local/bin/orbit
          fi
          chmod +x /usr/local/bin/orbit
          actual_version="$(
            orbit version --json |
              python3 -c 'import json, sys; print(json.load(sys.stdin)["data"]["version"].split()[0])'
          )"
          if [ "$actual_version" != "$ORBIT_VERSION" ]; then
            echo "paired demo expected $ORBIT_VERSION, installed $actual_version" >&2
            exit 1
          fi
          echo "Paired Orbit version: $actual_version"
      - name: Exercise the Orbit journey with occupied ports
        env:
          ORBIT_HOME: ${{ runner.temp }}/orbit-home
          ORBIT_NAMESPACE: orbit-demo-ci
          ORBIT_DASHBOARD_PORT: "23990"
        run: |
          cleanup() {
            orbit down --json >/dev/null 2>&1 || true
            orbit daemon stop --json >/dev/null 2>&1 || true
            kill "$port_guard_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          python3 - <<'PY' &
          import socket
          import time

          listeners = []
          for port in (26379, 28080, 28101, 28102, 28103):
              listener = socket.socket()
              listener.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              listener.bind(("127.0.0.1", port))
              listener.listen()
              listeners.append(listener)
          time.sleep(600)
          PY
          port_guard_pid=$!
          timeout 60 python3 - <<'PY'
          import socket
          import time

          for port in (26379, 28080, 28101, 28102, 28103):
              while True:
                  probe = socket.socket()
                  probe.settimeout(0.2)
                  if probe.connect_ex(("127.0.0.1", port)) == 0:
                      probe.close()
                      break
                  probe.close()
                  time.sleep(0.2)
          PY

          orbit up
          orbit status --json > "${{ runner.temp }}/status.json"
          python3 - "${{ runner.temp }}" <<'PY'
          import json
          import sys
          from pathlib import Path

          temp = Path(sys.argv[1])
          status = json.loads((temp / "status.json").read_text())
          assert status["ok"] is True, status
          resources = {
              resource["name"]: resource
              for resource in status["data"]["resources"]
          }
          expected = {
              "demo-shop",
              "shop-catalog-api",
              "shop-inventory-api",
              "shop-order-api",
              "redis",
          }
          assert expected == resources.keys(), resources.keys()
          assert all(
              resource["state"] == "healthy" for resource in resources.values()
          ), resources
          env_names = {
              "demo-shop": "DEMO_SHOP_URL",
              "shop-catalog-api": "SHOP_CATALOG_API_URL",
              "shop-inventory-api": "SHOP_INVENTORY_API_URL",
              "shop-order-api": "SHOP_ORDER_API_URL",
          }
          (temp / "urls.env").write_text(
              "".join(
                  f"{env_names[name]}={resources[name]['url']}\n"
                  for name in env_names
              )
          )
          PY
          set -a
          . "${{ runner.temp }}/urls.env"
          set +a
          python3 scripts/smoke.py
