name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validate Python
        run: python -m compileall -q envs/quickstart
      - name: Test HTTP service
        run: |
          python envs/quickstart/server.py > /tmp/orbit-demo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsS http://localhost:28080/ > /tmp/orbit-demo-response.json; then
              break
            fi
            sleep 1
          done
          python -c 'import json; data=json.load(open("/tmp/orbit-demo-response.json")); assert data["service"] == "demo-api"'
