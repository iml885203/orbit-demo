name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - name: Validate sources
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          for source in Path("envs/seeds/mini-shop").glob("*.py"):
              compile(source.read_text(), str(source), "exec")

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if values.get("id"):
                      self.ids.add(values["id"])

          page = Page()
          page.feed(Path("envs/seeds/mini-shop/index.html").read_text())
          required = {
              "run-success",
              "run-failure",
              "status",
              "result",
              "attempt",
              "stock-change",
              "reservation-change",
              "order-change",
              "adopt-project",
          }
          assert required <= page.ids, required - page.ids
          PY
          node - <<'JS'
          const fs = require("fs");
          const html = fs.readFileSync("envs/seeds/mini-shop/index.html", "utf8");
          const source = html.match(/<script>([\s\S]*?)<\/script>/)[1]
            .replaceAll("{{CATALOG_URL}}", "http://127.0.0.1:1")
            .replaceAll("{{INVENTORY_URL}}", "http://127.0.0.1:2")
            .replaceAll("{{ORDER_URL}}", "http://127.0.0.1:3");
          new Function(source);
          JS
          node --test tests/*.test.mjs
      - name: Install the paired Orbit preview
        env:
          ORBIT_VERSION: v0.4.0
        run: |
          if ! curl --fail --silent --show-error --location \
            --output /usr/local/bin/orbit \
            "https://github.com/iml885203/orbit/releases/download/${ORBIT_VERSION}/orbit-linux-amd64"; then
            git clone --depth 1 --branch "$ORBIT_VERSION" \
              https://github.com/iml885203/orbit.git orbit-source
            pnpm --dir orbit-source/ui install --frozen-lockfile
            make -C orbit-source build
            cp orbit-source/bin/orbit /usr/local/bin/orbit
          fi
          chmod +x /usr/local/bin/orbit
          actual_version="$(
            orbit version --json |
              python3 -c 'import json, sys; print(json.load(sys.stdin)["data"]["version"].split()[0])'
          )"
          if [ "$actual_version" != "$ORBIT_VERSION" ]; then
            echo "paired demo expected $ORBIT_VERSION, installed $actual_version" >&2
            exit 1
          fi
          echo "Paired Orbit version: $actual_version"
      - name: Exercise the real first-run journey with occupied ports
        env:
          ORBIT_HOME: ${{ runner.temp }}/orbit-home
          ORBIT_NAMESPACE: orbit-demo-ci
          ORBIT_DASHBOARD_PORT: "23990"
        run: |
          cleanup() {
            orbit down --json >/dev/null 2>&1 || true
            orbit daemon stop --json >/dev/null 2>&1 || true
            kill "$port_guard_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          python3 - <<'PY' &
          import socket
          import time

          listeners = []
          for port in (26379, 28080, 28101, 28102, 28103):
              listener = socket.socket()
              listener.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              listener.bind(("127.0.0.1", port))
              listener.listen()
              listeners.append(listener)
          time.sleep(600)
          PY
          port_guard_pid=$!

          mkdir -p "${{ runner.temp }}/empty-workspace"
          cd "${{ runner.temp }}/empty-workspace"
          orbit init --yes
          orbit env sync --path "$GITHUB_WORKSPACE" --yes
          orbit up
          python3 "$ORBIT_HOME/envs/seeds/mini-shop/smoke.py"
